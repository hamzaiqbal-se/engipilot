version: '3.9'

services:
  postgres:
    image: postgres:16
    container_name: engipilot_postgres
    restart: always
    environment:
      POSTGRES_USER: engipilot_admin
      POSTGRES_PASSWORD: engipilot_secure_2026
      POSTGRES_DB: engipilot_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: engipilot_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  chromadb:
    image: chromadb/chroma:latest
    container_name: engipilot_chromadb
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma

volumes:
  postgres_data:
  redis_data:
  chroma_data: