name: Run Backend Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: engipilot_admin
          POSTGRES_PASSWORD: engipilot_secure_2026
          POSTGRES_DB: engipilot_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          DATABASE_URL: postgresql://engipilot_admin:engipilot_secure_2026@localhost:5432/engipilot_db
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN_FOR_TESTS }}
          GITHUB_REPO: hamzaiqbal-se/engipilot
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          pytest tests/ -v
</parameter>